[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microjq"
version = "1.0.0"
description = "A minimal jq clone in Python for querying JSON from the command line"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["microjq*"]

[project.scripts]
microjq = "microjq.cli:main"
